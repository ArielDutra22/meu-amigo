<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07080c">

    <title>Entre Irmãos | Uma Amizade de Verdade</title>

    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>

    <div class="background-glow"></div>
    <div class="stars" id="stars"></div>

    <main class="experience">

        <div class="ambient-light"></div>

        <section class="garden" id="garden">

            <!-- CENA DOS DOIS BROTHERS -->
            <div class="friends-scene">

                <!-- VOCÊ: CAMISETA VERMELHA -->
                <div class="friend-character friend-one">

                    <div class="character-head">
                        <div class="character-hair"></div>
                        <div class="character-eye"></div>
                    </div>

                    <div class="character-neck"></div>

                    <div class="character-body">
                        <span class="shirt-detail"></span>
                    </div>

                    <div class="character-arm arm-left"></div>
                    <div class="character-arm arm-right"></div>

                    <div class="character-leg leg-left"></div>
                    <div class="character-leg leg-right"></div>

                    <div class="character-shoe shoe-left"></div>
                    <div class="character-shoe shoe-right"></div>

                </div>

                <!-- SEU AMIGO: CAMISETA AZUL -->
                <div class="friend-character friend-two">

                    <div class="character-head">
                        <div class="character-hair"></div>
                        <div class="character-eye"></div>
                    </div>

                    <div class="character-neck"></div>

                    <div class="character-body">
                        <span class="shirt-detail"></span>
                    </div>

                    <div class="character-arm arm-left"></div>
                    <div class="character-arm arm-right"></div>

                    <div class="character-leg leg-left"></div>
                    <div class="character-leg leg-right kicking-leg"></div>

                    <div class="character-shoe shoe-left"></div>
                    <div class="character-shoe shoe-right kicking-shoe"></div>

                </div>

                <!-- BOLA DE FUTEBOL -->
                <div class="football">
                    <div class="football-patch"></div>
                    <div class="football-seam"></div>
                </div>

                <!-- LEGENDA DOS AMIGOS -->
                <div class="friends-caption">
                    <span>✦</span> PARCERIA DE IRMÃOS
                </div>

            </div>

            <!-- LUZ DE FUNDO DA ROSA -->
            <div class="moonlight"></div>

            <!-- ROSA E MENSAGEM: MANTIDAS -->
            <div class="composition">

                <div class="rose-area">

                    <div class="rose-scene">

                        <div class="stem">
                            <div class="leaf leaf-left"></div>
                            <div class="leaf leaf-right"></div>
                            <div class="leaf leaf-small"></div>
                        </div>

                        <div class="flower">

                            <div class="petal petal-1"></div>
                            <div class="petal petal-2"></div>
                            <div class="petal petal-3"></div>
                            <div class="petal petal-4"></div>
                            <div class="petal petal-5"></div>
                            <div class="petal petal-6"></div>
                            <div class="petal petal-7"></div>
                            <div class="petal petal-8"></div>
                            <div class="petal petal-9"></div>
                            <div class="petal petal-10"></div>
                            <div class="petal petal-11"></div>
                            <div class="petal petal-12"></div>

                            <div class="petal petal-center"></div>
                            <div class="flower-core"></div>

                        </div>

                    </div>

                </div>

                <!-- MENSAGEM ORIGINAL -->
                <section class="message" id="message">

                    <span class="eyebrow">
                        PRA VOCÊ, MEU IRMÃO
                    </span>

                    <h1>
                        Nem todo irmão
                        <span>vem da mesma família.</span>
                    </h1>

                    <div class="divider">
                        <span></span>
                        <span class="divider-star">✦</span>
                        <span></span>
                    </div>

                    <p>
                        A vida coloca muita gente no nosso caminho,
                        mas são poucos os que realmente ficam.
                    </p>

                </section>

            </div>

            <!-- PÉTALAS ANIMADAS -->
            <div class="falling-petals" id="fallingPetals"></div>

            <!-- RODAPÉ -->
            <div class="bottom-label">
                <span class="status-dot"></span>
                UMA AMIZADE QUE VALE A PENA
            </div>

        </section>

    </main>

</body>
</html>
